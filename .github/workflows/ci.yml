name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_DB: ontario_energy
          POSTGRES_USER: energy_user
          POSTGRES_PASSWORD: test_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U energy_user -d ontario_energy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PYTHONPATH: src

      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: ontario_energy
      POSTGRES_USER: energy_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_SSLMODE: disable

      RAW_STORAGE_MODE: local
      S3_UPLOAD_ENABLED: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply database schema
        run: python scripts/apply_schema.py

      - name: Run tests
        run: pytest